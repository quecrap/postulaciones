<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pablo Campos Moreno | vCard</title>
  <meta name="description" content="Pablo Campos Moreno - Ingeniero multidisciplinario de cuello gris: ojo del diseño.">
  <meta name="theme-color" content="#030814">

  <!-- Open Graph -->
  <meta property="og:title" content="Pablo Campos Moreno">
  <meta property="og:description" content="Ingeniero multidisciplinario de cuello gris: ojo del diseño.">
  <meta property="og:type" content="profile">

  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-deep: #030814;
      --ice-primary: #38bdf8;
      --ice-light: #e0f2fe;
      --ice-glow: rgba(56, 189, 248, 0.28);
      --glass-surface: rgba(10, 25, 47, 0.6);
      --glass-border: rgba(186, 230, 253, 0.18);
      --glass-specular: rgba(255, 255, 255, 0.4);
      --text-main: #f8fafc;
      --text-frost: #bae6fd;
      --text-muted: #94a3b8;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      position: relative;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(14, 165, 233, 0.14) 0%, transparent 55%),
        radial-gradient(circle at 15% 75%, rgba(2, 132, 199, 0.12) 0%, transparent 50%),
        linear-gradient(180deg, #020611 0%, #06162a 50%, #030814 100%);
      background-attachment: fixed;
    }

    /* Ambient crystalline light reflections behind card */
    .ice-orb-1, .ice-orb-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    .ice-orb-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(14, 165, 233, 0) 70%);
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
    }

    .ice-orb-2 {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(125, 211, 252, 0.2) 0%, transparent 70%);
      bottom: 10%;
      right: 15%;
    }

    .container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    /* Frosted Glass Card */
    .card {
      background: var(--glass-surface);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-specular);
      border-radius: 28px;
      padding: 2.25rem 1.75rem;
      text-align: center;
      box-shadow: 
        0 30px 60px -15px rgba(2, 6, 23, 0.85),
        0 0 50px -10px var(--ice-glow),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      position: relative;
      transition: transform 0.3s ease;
    }

    /* Ice Droplet Avatar */
    .avatar-container {
      position: relative;
      display: inline-block;
      margin-bottom: 1.25rem;
    }

    .avatar-ice {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(56, 189, 248, 0.1) 100%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      box-shadow: 
        0 12px 30px -8px rgba(56, 189, 248, 0.4),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
      margin: 0 auto;
      backdrop-filter: blur(12px);
    }

    .droplet-icon {
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--text-frost);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.3rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 0.9rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
      animation: ripple 2.4s infinite ease-out;
    }

    @keyframes ripple {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Typography */
    h1.name {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 30%, #bae6fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.45rem;
    }

    p.title {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.5;
      font-weight: 400;
      margin-bottom: 1.6rem;
      padding: 0 0.5rem;
    }

    p.title strong {
      color: #e0f2fe;
      font-weight: 500;
    }

    /* Crystal QR Frame */
    .qr-crystal-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(186, 230, 253, 0.14);
      border-radius: 22px;
      padding: 1.25rem;
      margin-bottom: 1.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .qr-plate {
      background: #ffffff;
      padding: 12px;
      border-radius: 16px;
      display: inline-block;
      box-shadow: 
        0 14px 30px -5px rgba(2, 6, 23, 0.5),
        0 0 25px rgba(56, 189, 248, 0.18);
      line-height: 0;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode img, #qrcode canvas {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .qr-caption {
      margin-top: 0.85rem;
      font-size: 0.74rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Action Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.9rem 1.4rem;
      border-radius: 14px;
      font-size: 0.94rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border: none;
      width: 100%;
      font-family: inherit;
    }

    /* Ice Water Fluid Primary Button */
    .btn-primary {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      box-shadow: 
        0 8px 24px -4px rgba(2, 132, 199, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #7dd3fc 0%, #0369a1 100%);
      transform: translateY(-2px);
      box-shadow: 
        0 12px 28px -4px rgba(2, 132, 199, 0.6),
        0 0 20px rgba(56, 189, 248, 0.4);
    }

    /* Glass Ice Secondary Button */
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #e0f2fe;
      border: 1px solid rgba(186, 230, 253, 0.2);
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(186, 230, 253, 0.45);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .meta-url {
      margin-top: 1.3rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    .meta-url a {
      color: #7dd3fc;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .meta-url a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Minimal Watermark Footer */
    footer {
      margin-top: 1.8rem;
      font-size: 0.74rem;
      color: #64748b;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .azure-tag {
      color: #38bdf8;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Frost Toast Notification */
    #toast {
      position: fixed;
      bottom: 28px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      color: #f0f9ff;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 0.65rem 1.3rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(14px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      box-shadow: 0 12px 30px -5px rgba(2, 6, 23, 0.7);
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Ambient light orbs for depth -->
  <div class="ice-orb-1"></div>
  <div class="ice-orb-2"></div>

  <div class="container">
    <main class="card">
      
      <!-- Ice Droplet Icon -->
      <div class="avatar-container">
        <div class="avatar-ice">
          <svg class="droplet-icon" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
          </svg>
        </div>
      </div>

      <div class="status-pill">
        <span class="status-dot"></span>
        Tarjeta Digital
      </div>

      <h1 class="name">Pablo Campos Moreno</h1>
      <p class="title">Ingeniero multidisciplinario de cuello gris:<br><strong>ojo del diseño.</strong></p>

      <!-- Dynamic QR Code Container -->
      <section class="qr-crystal-box">
        <div class="qr-plate">
          <div id="qrcode"></div>
        </div>
        <div class="qr-caption">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M9 9h6v6H9z"/>
          </svg>
          Escanea para abrir o compartir
        </div>
      </section>

      <!-- Actions -->
      <div class="actions">
        <!-- Direct Download vCard -->
        <a href="contact.vcf" download="Pablo_Campos_Moreno.vcf" class="btn btn-primary" id="btn-vcard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Guardar Contacto (.vcf)
        </a>

        <!-- Copy Link / Share -->
        <button type="button" class="btn btn-secondary" id="btn-copy">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copiar Enlace
        </button>
      </div>

      <!-- Target URL preview -->
      <div class="meta-url">
        Destino: <a href="#" id="qr-target-link" target="_blank" rel="noopener">Cargando...</a>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <span>Alojado en</span>
      <span class="azure-tag">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.97 2.29a.75.75 0 0 0-1.06 0L2.3 11.9a.75.75 0 0 0 0 1.06l9.61 9.61a.75.75 0 0 0 1.06 0l9.61-9.61a.75.75 0 0 0 0-1.06L12.97 2.29zM12 4.41l7.85 7.85-7.85 7.85-7.85-7.85L12 4.41z"/>
        </svg>
        Azure Static Web Apps
      </span>
    </footer>
  </div>

  <div id="toast">✓ Enlace copiado al portapapeles</div>

  <script>
    // URL definitiva de Azure
    const AZURE_DEPLOY_URL = "https://jolly-mushroom-037b7c310.4.azurestaticapps.net";

    const isLocal = window.location.protocol === "file:" || 
                    window.location.hostname === "localhost" || 
                    window.location.hostname === "127.0.0.1";

    const targetUrl = isLocal ? AZURE_DEPLOY_URL : window.location.href;

    // Actualizar enlace visible
    const linkEl = document.getElementById("qr-target-link");
    linkEl.textContent = targetUrl;
    linkEl.href = targetUrl;

    // Generar Código QR con Nivel H de corrección de errores (máxima calidad)
    try {
      new QRCode(document.getElementById("qrcode"), {
        text: targetUrl,
        width: 175,
        height: 175,
        colorDark: "#030814",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H // Error Correction Level H (30%)
      });
    } catch (err) {
      console.error("Error generando QR:", err);
      document.getElementById("qrcode").innerText = "Error cargando QR";
    }

    // Funcionalidad de Copiar Enlace con Toast
    const copyBtn = document.getElementById("btn-copy");
    const toast = document.getElementById("toast");

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(targetUrl);
        showToast("✓ Enlace copiado al portapapeles");
      } catch (e) {
        const temp = document.createElement("input");
        temp.value = targetUrl;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        showToast("✓ Enlace copiado");
      }
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2400);
    }
  </script>
</body>
</html>
